plugins {
    id 'com.android.application'
}

android {
    namespace 'cd.dprnk.t6print'
    compileSdk 34

    defaultConfig {
        applicationId 'cd.dprnk.t6print'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
